<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="vz-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
    <linearGradient id="vz-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded hexagon -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#0D0F18" stroke="url(#vz-grad-primary)" stroke-width="1.5"/>
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#vz-glow)"/>

  <!-- Dynamic Soundwave V-Shape -->
  <g filter="url(#glow-blur)">
    <!-- Left bar -->
    <rect x="8" y="15" width="3.2" height="10" rx="1.6" fill="url(#vz-grad-primary)"/>
    <!-- Second bar -->
    <rect x="13.2" y="11" width="3.2" height="18" rx="1.6" fill="url(#vz-grad-primary)"/>
    <!-- Center Valley/Vertex -->
    <rect x="18.4" y="17" width="3.2" height="12" rx="1.6" fill="#00F0FF"/>
    <!-- Fourth bar -->
    <rect x="23.6" y="9" width="3.2" height="22" rx="1.6" fill="url(#vz-grad-primary)"/>
    <!-- Right bar -->
    <rect x="28.8" y="14" width="3.2" height="12" rx="1.6" fill="url(#vz-grad-primary)"/>
  </g>
</svg>
